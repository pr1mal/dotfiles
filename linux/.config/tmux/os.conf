# vim: ft=tmux
# Linux-only tmux settings, sourced by tmux.conf.
# The macOS counterpart is macos/.config/tmux/os.conf in the dotfiles repo.

# Ptyxis (VTE) ignores OSC 52, so `set-clipboard on` can't reach the system
# clipboard: pipe tmux copies to the Wayland clipboard instead.
set -s copy-command 'wl-copy'

# Open current directory in Files
bind o run-shell "xdg-open #{pane_current_path}"
