# Hotkeys (GNOME extension hotkeys@es.local)
# Save this file and the keys change at once; no logout needed.
#
# Each line:  <key>  <action>
#
#   key     MEH+B, MEH+Left, MEH+Return, HYPER+1, Ctrl+Alt+T, Super+E ...
#           MEH = Ctrl+Shift+Alt, HYPER = Ctrl+Shift+Alt+Super.
#           Letters are the letters on the key in your layout (Colemak).
#           Other names: Left Right Up Down Return BackSpace space Tab
#           Escape Home End minus equal comma period slash bracketleft ...
#
#   action  app <file.desktop>     focus the app, or launch it if it isn't
#                                  running; press again while it is in front
#                                  to send it back to the app used before it
#           run <command>          run a shell command
#           overview               GNOME search (same as tapping Super)
#           left-half right-half top-half bottom-half
#           first-third center-third last-third
#           first-two-thirds last-two-thirds
#           top-left-quarter top-right-quarter
#           bottom-left-quarter bottom-right-quarter
#           maximize  almost-maximize  center  restore
#
# Desktop file names: ls /usr/share/applications ~/.local/share/applications \
#                        /var/lib/snapd/desktop/applications
#
# MEH+C opens clipboard history; that key is set in Copyous, not here.

# Apps
MEH+Q          app  org.gnome.Ptyxis.desktop
MEH+W          app  zen.desktop
MEH+P          app  slack_slack.desktop
MEH+G          app  org.gnome.Calendar.desktop
MEH+R          app  com.anthropic.Claude.desktop
MEH+B          app  jetbrains-idea.desktop
MEH+Z          app  Zoom.desktop

# Search
MEH+space      overview

# Windows
MEH+Left       left-half
MEH+Right      right-half
MEH+Up         top-half
MEH+Down       bottom-half
MEH+Return     maximize
MEH+BackSpace  restore
MEH+1          first-third
MEH+2          center-third
MEH+3          last-third
MEH+4          first-two-thirds
MEH+5          last-two-thirds
MEH+9          almost-maximize
MEH+O          center
