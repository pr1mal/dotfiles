set -g default-terminal "tmux-256color"
#set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:indn@'
#set -ga terminal-overrides ",xterm-256color:Tc"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on
bind C-t send-prefix
unbind t

#### Key bindings

set-window-option -g mode-keys vi

# Reload settings
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind -r e kill-pane -a

#### Panes
# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
# splitting pane
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v
# switch to previously active pane
bind -r t last-pane
bind -r C-t last-window

# enable mouse
set -g mouse on

#### basic settings

set-window-option -g mode-keys vi
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Undercurl and coloured underlines (e.g. spelling/diagnostics in nvim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# macOS or Linux specifics (from macos/ or linux/ in the dotfiles repo)
source-file -q ~/.config/tmux/os.conf

# source ~/.config/tmux/craftzdog-theme.conf
source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
#set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# catppuccin config
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
#set -g @catppuccin_window_middle_separator " █" # for window_number_position "right"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_status_enable "yes"
set -g @catppuccin_window_status_icon_enable "no"

set -g @catppuccin_application_text "#{pane_current_command}"
set -g @catppuccin_status_modules_left "session "

set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_directory_color "#fab387"
set -g @catppuccin_status_modules_right "application directory date_time"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
# init tmux plugin mgr (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
